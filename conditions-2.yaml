- name: check if the number is even
  hosts: local
  connection: local
  vars:
    number: 150
  tasks:
  - name:  number is even
    debug:
      msg: HI , the given number {{ number }} is even
    when: number % 2 == 0
  - name: number is odd
    debug:
      msg: HI , the given number {{ number }} is odd
    when: number % 2 != 0