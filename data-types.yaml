- name: data types
  hosts: local
  connection: local
  vars:
    course: "AIops with Devsecops on aws" # string
    duration_in_hrs: "150" #integer
    is_live_session: true #boolean
    topics:  #list
      - Linux
      - shell-scripting
      - ansible
    more_details: #map/dictionary
      trainer: sivakumar
      months: 4
    exact_duration_in_months: 4.5
  tasks:
    - name: print the values
      debug:
        msg: |
          name: "{{ course }} : {{ course | type_debug }}"
          duration: "{{ duration_in_hrs }} : {{ duration_in_hrs | type_debug }}"
          is live: "{{ is_live_session }}: {{ is_live_session| type_debug }}"