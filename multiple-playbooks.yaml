- name: "directory and file creation"
  hosts: local
  connection: local
  become: true
  tasks:
    - name: "creating a directory"
      ansible.builtin.file:
        path: /odela_raju
        state: directory
        mode: '0755'
    - name: "creating a file"
      ansible.builtin.file:
        path: /odela_raju/foo.conf
        state: touch
        mode: u=rw,g=r,o=r

