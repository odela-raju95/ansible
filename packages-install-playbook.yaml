- name: "install packages"
  hosts: frontend
  become: true
  tasks:
    - name: "install nginx"
      ansible.builtin.package:
        name: "nginx"
        state: "latest"
    - name: "install ansible on remote machine"
      ansible.builtin.package:
        name: "ansible"
        state: "latest"
    - name: "start nginx"
      ansible.builtin.service:
        name: "nginx"
        state: started